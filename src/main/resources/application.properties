quarkus.http.charset=UTF-8
quarkus.default-charset=UTF-8
quarkus.log.console.charset=UTF-8

# --- Metadados da API (OpenAPI / Swagger UI) ---
# Define a identidade da sua API na documentação.
quarkus.smallrye-openapi.info-title=API Cão Amigo
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.open-api-version=3.0.4
quarkus.smallrye-openapi.info-description=Esta API foi desenvolvida para gerenciar um sistema de adoção de cachorros... (descrição completa)
quarkus.smallrye-openapi.info-terms-of-service=No terms
quarkus.smallrye-openapi.info-contact-name=Laís Carvalho de Oliveira
quarkus.smallrye-openapi.info-contact-email=laiscarvalho858@gmail.com
quarkus.smallrye-openapi.info-contact-url=http://caomigoapi.com/contact
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
quarkus.swagger-ui.theme=flattop

# --- Configurações Customizadas da Aplicação ---
# Parâmetros lidos pelo seu código para implementar regras de negócio.
rate.limit.requests=10
rate.limit.window.seconds=60

# --- Timeout (usando propriedade padrão do Quarkus) ---
# Define o tempo máximo que uma conexão pode ficar ociosa (30 segundos).
quarkus.http.idle-timeout=30s


################################################################################
# 2. PERFIL DE DESENVOLVIMENTO (DEV)
# Ativado ao rodar 'quarkus dev'. Otimizado para agilidade e testes.
################################################################################

# --- Título da API em DEV ---
%dev.quarkus.smallrye-openapi.info-title=API Cão Amigo (DEV)

# --- Documentação da API sempre visível em DEV ---
%dev.quarkus.swagger-ui.always-include=true

# --- Banco de Dados em Memória (H2) para DEV ---
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb

# --- Geração do Banco: DESTRÓI E RECRIA a cada reinício ---
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

# --- Script de Carga de Dados para testes em DEV ---
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# --- Log de SQL ativo para depuração em DEV ---
%dev.quarkus.hibernate-orm.log.sql=true

# --- CORS permissivo para facilitar o desenvolvimento do front-end ---
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=/.*/
%dev.quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS


################################################################################
# 3. PERFIL DE PRODUÇÃO (PROD)
# Ativado ao compilar o JAR e rodar ('java -jar ...'). Otimizado para segurança e performance.
################################################################################

# --- Título da API em PROD ---
%prod.quarkus.smallrye-openapi.info-title=API Cão Amigo

# --- Documentação da API DESATIVADA em PROD por segurança ---
%prod.quarkus.swagger-ui.always-include=false

# --- Banco de Dados PostgreSQL para PROD (substitua com suas credenciais) ---
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/caomigo_db
%prod.quarkus.datasource.username=seu-usuario-prod
%prod.quarkus.datasource.password=sua-senha-prod

# --- Geração do Banco: APENAS VALIDA o esquema existente. NUNCA destrói dados. ---
%prod.quarkus.hibernate-orm.database.generation=validate

# --- Log de SQL DESATIVADO em PROD para melhor performance ---
%prod.quarkus.hibernate-orm.log.sql=false

# --- CORS restrito ao domínio do seu front-end em PROD ---
%prod.quarkus.http.cors=true
%prod.quarkus.http.cors.origins=https://www.seu-site.com.br,https://seu-outro-site.com.br
%prod.quarkus.http.cors.methods=GET,PUT,POST,DELETE
